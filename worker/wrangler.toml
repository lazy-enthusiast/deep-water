name = "deep-water-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 非 Secret 的環境變數放這裡
[vars]
PROXY_URL = "https://deep-water-proxy.vercel.app/api/chat"
# NAME 和 PROXY_SECRET 是 Secret，不要寫在這裡

# 如果你有 R2 綁定，取消註解並填入
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "你的-bucket-名稱"
